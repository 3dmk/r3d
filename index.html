<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polygon Rush v12.4 Web Debug</title>
<style>
:root{--bg:#071018;--panel:rgba(8,15,23,.91);--line:rgba(255,255,255,.14);--text:#f5f8fb;--muted:#9badbd;--accent:#7be3a1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090e;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}canvas{display:block}button,select{font:inherit}.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);box-shadow:0 20px 70px #0008;border-radius:16px}#menu{position:fixed;z-index:20;left:16px;top:16px;width:min(430px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;padding:16px}.title{font-size:30px;font-weight:950;letter-spacing:-.05em}.sub{font-size:11px;color:var(--muted);margin:3px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.section{border-top:1px solid var(--line);margin-top:13px;padding-top:13px}label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:11px}select{background:#0d1822;color:#fff;border:1px solid var(--line);border-radius:9px;padding:9px}button{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#14222e;color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#7be3a1,#63caff);color:#06130b;border:0}.row{display:flex;gap:8px}.tiny{font-size:10px;color:var(--muted);line-height:1.45}#hud{position:fixed;z-index:10;left:10px;right:10px;top:10px;display:none;justify-content:space-between;gap:7px;pointer-events:none}.hud{min-width:105px;padding:7px 9px;border-radius:11px;background:#050a0fb8;border:1px solid var(--line)}.hudL{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.hudV{font-size:22px;font-weight:950}#msg{position:fixed;z-index:12;left:50%;top:40%;transform:translate(-50%,-50%);font-size:46px;font-weight:950;text-shadow:0 8px 28px #000;pointer-events:none;text-align:center}#debugBtn{position:fixed;right:10px;bottom:10px;z-index:30;background:#ffd166;color:#1a1200}#debug{display:none;position:fixed;right:10px;bottom:52px;z-index:29;width:min(400px,calc(100vw - 20px));max-height:55vh;overflow:auto;padding:12px;background:#050a0ff2;border:1px solid var(--line);border-radius:12px;font:11px/1.5 Consolas,monospace;white-space:pre-wrap;user-select:text}#debug.open{display:block}#pause{display:none;position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;width:280px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{font-size:10px;padding:7px}.card.active{outline:2px solid var(--accent);background:#173026}@media(max-width:700px){#menu{left:7px;top:7px;width:calc(100vw - 14px);padding:12px}.hudV{font-size:16px}#hud{gap:4px}.hud{min-width:0;padding:5px 6px}#msg{font-size:34px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="hud"><div class="hudL">Position</div><div class="hudV"><span id="pos">1</span>/5</div></div><div class="hud"><div class="hudL">Lap</div><div class="hudV"><span id="lap">1</span>/3</div></div><div class="hud"><div class="hudL">Speed</div><div class="hudV"><span id="speed">0</span> <small>km/h</small></div></div><div class="hud"><div class="hudL">Time</div><div class="hudV" id="time">00:00.0</div></div></div>
<div id="msg"></div>
<div id="menu" class="panel"><div class="title">POLYGON RUSH</div><div class="sub">v12.4 WEB DEBUG • road orientation fix</div><div class="grid"><label>World<select id="track"><option value="coast">Azure Coast</option><option value="forest">Pine Summit</option><option value="canyon">Canyon Foundry</option><option value="neon">Neon Harbor</option><option value="alpine">Alpine Skyway</option></select></label><label>Mode<select id="mode"><option value="circuit">Circuit Race</option><option value="drift">Drift Attack</option><option value="checkpoint">Checkpoint Rush</option></select></label><label>Difficulty<select id="difficulty"><option value="0.92">Easy</option><option value="1" selected>Arcade</option><option value="1.08">Hard</option><option value="1.15">Expert</option></select></label><label>Graphics<select id="quality"><option value="0.8">Low</option><option value="1" selected>Medium</option><option value="1.35">High</option></select></label></div><div class="section tiny">Choose car</div><div id="cars" class="cards"></div><div class="section row"><button id="start" class="primary" style="flex:1">START RACE</button><button id="preview">PREVIEW WORLD</button></div><div class="section tiny"><b>Controls:</b> W/↑ throttle • S/↓ brake • A/D or ←/→ steer • Space nitro • R recover • Esc pause • F3 debug.</div></div>
<div id="pause" class="panel"><div class="title" style="font-size:23px">PAUSED</div><div class="section row"><button id="resume" class="primary">RESUME</button><button id="quit">QUIT</button></div></div>
<button id="debugBtn">DEBUG F3</button><div id="debug"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),TAU=Math.PI*2;if(!window.THREE){document.body.innerHTML='<div style="padding:40px;color:white">Three.js failed to load. Check internet/content blocker and reload.</div>';return}
const zones={coast:{sky:0x8dcde1,ground:0x73ad71,road:0x333d44,accent:0xffd166,water:0x4babc8},forest:{sky:0x88b5c6,ground:0x4e784d,road:0x343a3d,accent:0xffbd5c,water:0x4f7f94},canyon:{sky:0xdabf99,ground:0xc7834d,road:0x443e39,accent:0x6ce0d6,water:0x668aa0},neon:{sky:0x17263c,ground:0x243341,road:0x1a2027,accent:0xff5fd2,water:0x284f73},alpine:{sky:0xaed2e0,ground:0xb8c5c9,road:0x394147,accent:0xff716b,water:0x6eafca}};
const carDefs=[['Comet',0xff5c57,29,56],['Mint GT',0x65e0a3,26,58],['Bolt',0x5bbcff,32,53],['Sunray',0xffcf57,25,60],['Violet R',0xb180ff,28,56],['Pearl',0xf3f4f7,27,57],['Rally Fox',0xff8b4a,30,54],['Aqua RS',0x4fe1df,31,57],['Nightbird',0x303743,28,62],['Lime X',0xa8f05a,33,55],['Crimson 9',0xb83838,27,59],['Royal V12',0x5361d8,26,63]];let selected=0;
const scene=new THREE.Scene(),world=new THREE.Group(),carsG=new THREE.Group();scene.add(world,carsG);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe6f6ff,0x3a3028,1.7));const sun=new THREE.DirectionalLight(0xfff0cf,3.3);sun.position.set(-70,110,50);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-170;sun.shadow.camera.right=170;sun.shadow.camera.top=170;sun.shadow.camera.bottom=-170;scene.add(sun);const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,900);
let curve,pts=[],racers=[],running=false,paused=false,startAt=0,last=performance.now(),keys={},fps=0,frames=0,fpsT=performance.now(),nitro=0;
function carButtons(){const h=$('#cars');h.innerHTML='';carDefs.forEach((c,i)=>{const b=document.createElement('button');b.className='card'+(i===selected?' active':'');b.textContent=c[0];b.style.boxShadow='inset 0 3px 0 #'+c[1].toString(16).padStart(6,'0');b.onclick=()=>{selected=i;carButtons()};h.appendChild(b)})}carButtons();
function clear(g){while(g.children.length){const o=g.children.pop();o.geometry?.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}}}
function buildRoadRibbon(points,width,color){const n=points.length,pos=[],idx=[],uv=[];for(let i=0;i<n;i++){const p=points[i],prev=points[(i-1+n)%n],next=points[(i+1)%n];const t=next.clone().sub(prev);t.y=0;if(t.lengthSq()<1e-5)t.set(0,0,1);t.normalize();const side=new THREE.Vector3(-t.z,0,t.x).normalize();const l=p.clone().addScaledVector(side,width*.5);const r=p.clone().addScaledVector(side,-width*.5);l.y+=.28;r.y+=.28;pos.push(l.x,l.y,l.z,r.x,r.y,r.z);uv.push(0,i/n*20,1,i/n*20)}for(let i=0;i<n;i++){const ni=(i+1)%n,a=i*2,b=a+1,c=ni*2,d=c+1;idx.push(a,b,c,b,d,c)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();const m=new THREE.MeshStandardMaterial({color,roughness:.82,metalness:.04,side:THREE.DoubleSide});const road=new THREE.Mesh(g,m);road.receiveShadow=true;return road}
function makeWorld(name){clear(world);const z=zones[name];scene.background=new THREE.Color(z.sky);scene.fog=new THREE.FogExp2(z.sky,name==='neon'?.004:.0026);const ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({color:z.ground,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.15;ground.receiveShadow=true;world.add(ground);pts=[];const N=220;for(let i=0;i<N;i++){const a=i/N*TAU,r=112+18*Math.sin(a*3)+9*Math.sin(a*5+1.2),x=Math.cos(a)*r,zp=Math.sin(a)*r,y=(name==='alpine'?5:2.5)*Math.sin(a*2)+(name==='canyon'?3.5*Math.sin(a*4):0);pts.push(new THREE.Vector3(x,y,zp))}curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',.08);world.add(buildRoadRibbon(pts,16,z.road));const lineMat=new THREE.MeshStandardMaterial({color:z.accent,emissive:name==='neon'?z.accent:0,emissiveIntensity:name==='neon'?1.2:0});for(let i=0;i<N;i+=7){const p=pts[i],n=pts[(i+1)%N].clone().sub(p);n.y=0;n.normalize();const m=new THREE.Mesh(new THREE.BoxGeometry(.35,.07,3.2),lineMat);m.position.copy(p);m.position.y+=.38;m.rotation.y=Math.atan2(n.x,n.z);world.add(m)}for(let i=0;i<80;i++){const a=Math.random()*TAU,r=155+Math.random()*190,p=new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),tree=name==='forest'||name==='alpine',geo=tree?new THREE.ConeGeometry(3+Math.random()*3,10+Math.random()*10,6):new THREE.DodecahedronGeometry(3+Math.random()*6,0),mat=new THREE.MeshStandardMaterial({color:name==='canyon'?0x8a684e:name==='neon'?0x33445a:0x356c46,roughness:1}),o=new THREE.Mesh(geo,mat);o.position.copy(p);o.position.y=tree?5:3;o.castShadow=true;world.add(o)}if(name==='coast'||name==='neon'){const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:z.water,roughness:.28,metalness:.08,transparent:true,opacity:.82}));water.rotation.x=-Math.PI/2;water.position.y=-2.4;world.add(water)}}
function makeCar(def,human=false){const g=new THREE.Group(),bodyMat=new THREE.MeshStandardMaterial({color:def[1],roughness:.28,metalness:.35}),dark=new THREE.MeshStandardMaterial({color:0x15191d,roughness:.55});const base=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,4.4),bodyMat);base.position.y=.85;base.castShadow=true;g.add(base);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.75,.62,2.15),new THREE.MeshStandardMaterial({color:0x253542,roughness:.18,metalness:.15}));cabin.position.set(0,1.38,-.1);g.add(cabin);for(const x of [-1.02,1.02])for(const z of [-1.38,1.38]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.34,12),dark);w.rotation.z=Math.PI/2;w.position.set(x,.58,z);g.add(w)}carsG.add(g);return{g,def,speed:0,t:0,lap:0,human,steer:0}}
function spawn(){clear(carsG);racers=[];for(let i=0;i<5;i++){const r=makeCar(carDefs[i?i%carDefs.length:selected],i===0);r.t=(1-i*.014+1)%1;r.g.position.copy(curve.getPointAt(r.t));racers.push(r)}}
function tangentAt(t){return curve.getTangentAt((t%1+1)%1).normalize()}
function updateCar(r,dt,i){const diff=+$('#difficulty').value;if(r.human){const gas=keys.KeyW||keys.ArrowUp,br=keys.KeyS||keys.ArrowDown,left=keys.KeyA||keys.ArrowLeft,right=keys.KeyD||keys.ArrowRight;r.steer+=(Number(right)-Number(left)-r.steer)*Math.min(1,dt*8);const accel=r.def[2]*(gas?1:0)-(br?34:0)-2;r.speed=clamp(r.speed+accel*dt,0,r.def[3]+nitro);nitro=keys.Space?12:Math.max(0,nitro-dt*20)}else{const target=r.def[3]*(.78+.05*i)*diff;r.speed+=(target-r.speed)*Math.min(1,dt*1.3)}const old=r.t;r.t=(r.t+r.speed*dt/760)%1;if(r.t<old-.5)r.lap++;const p=curve.getPointAt(r.t),tan=tangentAt(r.t);r.g.position.copy(p);r.g.position.y+=.35;r.g.rotation.set(0,Math.atan2(tan.x,tan.z)+r.steer*.05,0)}
function cameraFollow(){const r=racers[0];if(!r)return;const tan=tangentAt(r.t),p=r.g.position.clone();const desired=p.clone().addScaledVector(tan,-10).add(new THREE.Vector3(0,5.4,0));cam.position.lerp(desired,.09);cam.lookAt(p.clone().addScaledVector(tan,7).add(new THREE.Vector3(0,1.3,0)))}
function startRace(){makeWorld($('#track').value);spawn();running=true;paused=false;startAt=performance.now();$('#menu').style.display='none';$('#hud').style.display='flex';$('#msg').textContent='GO!';setTimeout(()=>$('#msg').textContent='',700)}
function preview(){makeWorld($('#track').value);spawn();const r=racers[0];cam.position.copy(r.g.position).add(new THREE.Vector3(0,36,56));cam.lookAt(r.g.position)}
function updateHud(){if(!racers[0])return;const r=racers[0];$('#speed').textContent=Math.round(r.speed*3.6);$('#lap').textContent=Math.min(3,r.lap+1);const rank=[...racers].sort((a,b)=>(b.lap+b.t)-(a.lap+a.t)).indexOf(r)+1;$('#pos').textContent=rank;const t=(performance.now()-startAt)/1000,$t=$('#time');$t.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')+'.'+Math.floor((t%1)*10)}
function debug(){const r=racers[0];$('#debug').textContent=['Polygon Rush v12.4','FPS: '+fps,'Road mesh: horizontal ribbon','Track: '+$('#track').value,'Running: '+running,'Paused: '+paused,'Speed: '+(r?Math.round(r.speed*3.6):0)+' km/h','Lap: '+(r?r.lap+1:0),'WebGL: '+renderer.capabilities.isWebGL2,'Draw calls: '+renderer.info.render.calls,'Triangles: '+renderer.info.render.triangles].join('\n')}
$('#start').onclick=startRace;$('#preview').onclick=preview;$('#track').onchange=preview;$('#resume').onclick=()=>{paused=false;$('#pause').style.display='none'};$('#quit').onclick=()=>{running=false;paused=false;$('#pause').style.display='none';$('#hud').style.display='none';$('#menu').style.display='block';preview()};$('#debugBtn').onclick=()=>{$('#debug').classList.toggle('open');debug()};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='F3'){e.preventDefault();$('#debug').classList.toggle('open');debug()}if(e.code==='Escape'&&running){paused=!paused;$('#pause').style.display=paused?'block':'none'}if(e.code==='KeyR'&&racers[0]){racers[0].speed=0;racers[0].g.position.copy(curve.getPointAt(racers[0].t))}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
makeWorld('coast');spawn();cam.position.set(0,90,160);cam.lookAt(0,0,0);function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(running&&!paused){racers.forEach((r,i)=>updateCar(r,dt,i));cameraFollow();updateHud()}renderer.render(scene,cam);frames++;if(now-fpsT>500){fps=Math.round(frames*1000/(now-fpsT));frames=0;fpsT=now;if($('#debug').classList.contains('open'))debug()}}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
