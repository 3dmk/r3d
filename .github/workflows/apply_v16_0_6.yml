name: Apply Polygon Rush v16.0.6 Mobile Controls Visibility Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply_v16_0_6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v16.0.6
        run: node polygon-rush/engineering/v16_0_6_mobile_controls_visibility_fix.mjs polygon-rush/production/index.html
      - name: Validate runtime
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('polygon-rush/production/index.html').read_text()
          assert "const VERSION='16.0.6'" in s
          for x in ['max-width:1100px','/Android/i','mobileControlsVisible','setupMobileControls','gasTouch','steerPad']:
              assert x in s,x
          m=re.search(r'<script type="module">([\s\S]*?)</script>',s); assert m
          code=m.group(1)
          code=re.sub(r"^import .*?;$",'',code,flags=re.M)
          pathlib.Path('/tmp/pr166.mjs').write_text(code)
          PY
          node --check /tmp/pr166.mjs
      - name: Update metadata
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=pathlib.Path('polygon-rush/production');p=r/'BUILD.json';d=json.loads(p.read_text())
          d['productionVersion']='16.0.6';d['parentProductionVersion']='16.0.5';d['handlingFix']='mobile-controls-visibility-fix'
          d['features']=list(dict.fromkeys(d.get('features',[])+['android-webview-controls-visible','mobile-viewport-control-fallback']))
          d['indexSha256']=hashlib.sha256((r/'index.html').read_bytes()).hexdigest();d['threeSha256']=hashlib.sha256((r/'three.min.js').read_bytes()).hexdigest();p.write_text(json.dumps(d,indent=2)+'\n');(r/'VERSION.txt').write_text('16.0.6\n')
          PY
      - name: Commit production
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add polygon-rush/production/index.html polygon-rush/production/BUILD.json polygon-rush/production/VERSION.txt
          git commit -m 'Promote Polygon Rush v16.0.6 mobile controls visibility fix'
          git push
