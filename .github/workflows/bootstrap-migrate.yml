name: Bootstrap R3D Migration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current standalone R3D sources
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/3dmk/3D_Lite/main/r3d"
          files=(
            index.html
            README.md
            browser-smoke.spec.js
            release-check.mjs
            r3d-editor.js
            r3d-renderer.js
            r3d-render-watchdog.js
            r3d-output-orientation.js
            r3d-input-priority-shim.js
            r3d-local-orbit.js
            r3d-camera-gizmos.js
            r3d-bootstrap.js
          )
          for f in "${files[@]}"; do
            curl --fail --silent --show-error --location "$base/$f" --output "$f"
          done
          sed -i "s#http://127.0.0.1:4173/r3d/#http://127.0.0.1:4173/#g" browser-smoke.spec.js
          printf '\nStandalone repository: https://github.com/3dmk/R3D\n' >> README.md
      - name: Commit migrated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md browser-smoke.spec.js release-check.mjs r3d-*.js
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Migrate standalone R3D from 3D_Lite"
            git push origin main
          fi
