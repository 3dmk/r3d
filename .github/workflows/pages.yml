name: Deploy Polygon Rush Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Polygon Rush v15.0.2 Drive + Countdown Fix
        run: |
          cat polygon-rush/v14.6/source/part*.txt > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(',1)}\n }\n}\n\nconst renderer','const renderer',1)
          old="const id=m._pr_b3_create_vehicle(BOX3D.world,car.pos.x,car.pos.y,car.pos.z,car.heading);"
          new="const id=m._pr_b3_create_vehicle(BOX3D.world,car.pos.x,car.pos.y+.90,car.pos.z,car.heading);"
          if old not in s: raise SystemExit('Box3D create vehicle signature not found')
          s=s.replace(old,new,1)
          old="car.pos.set(f[base],f[base+1],f[base+2]);"
          new="car.pos.set(f[base],f[base+1]-.90,f[base+2]);"
          if old not in s: raise SystemExit('Box3D sync position not found')
          s=s.replace(old,new,1)
          old="function start(){buildWorld($('#track').value);spawn();running=true;paused=false;raceTime=0;$('#menu').style.display='none';$('#hud').style.display='flex';$('#msg').textContent='GO!';setTimeout(()=>$('#msg').textContent='',700)}"
          new="function start(){\n const menu=$('#menu'),hud=$('#hud'),msg=$('#msg'),btn=$('#start');\n if(btn){btn.disabled=true;btn.textContent='STARTING...'}\n if(menu)menu.style.display='none';if(hud)hud.style.display='flex';if(msg)msg.textContent='LOADING RACE...';\n try{const track=$('#track')?.value||'coast';buildWorld(track);spawn();if(!player||ais.length!==4)throw new Error('Racer spawn failed: '+(player?1:0)+' player + '+ais.length+' opponents');running=true;paused=false;raceTime=0;raceStarted=true;finished=false;countdown=0;if(BOX3D.active){box3dDestroyAll();box3dClearStatics();box3dBuildTrackWorld();box3dCreateVehicle(player);for(const ai of ais)box3dCreateVehicle(ai);if(BOX3D.bodies.size!==5)throw new Error('Box3D racer body creation failed: '+BOX3D.bodies.size+'/5')}if(msg)msg.textContent='GO!';setTimeout(()=>{if(msg)msg.textContent=''},700)}catch(e){console.error('START RACE FAILED',e);running=false;paused=false;if(menu)menu.style.display='block';if(hud)hud.style.display='none';if(msg){msg.textContent='START ERROR — PRESS F3';msg.style.display='block'}const dbg=$('#debug');if(dbg){dbg.classList.add('open');dbg.textContent='START RACE ERROR\\n'+(e?.stack||e)}}finally{if(btn){btn.disabled=false;btn.textContent='START RACE'}}\n}"
          if old not in s: raise SystemExit('expected start() function not found')
          s=s.replace(old,new,1)
          s=s.replace("$('#start').onclick=start;","const startButton=$('#start');if(startButton)startButton.addEventListener('click',e=>{e.preventDefault();start()});",1)
          p.write_text(s)
          PY
          node polygon-rush/engineering/pass1_patch.mjs index.html
          node polygon-rush/engineering/pass2_patch.mjs index.html
          node polygon-rush/engineering/pass3_patch.mjs index.html
          node polygon-rush/engineering/v15_0_1_runtime_hotfix.mjs index.html
          node polygon-rush/engineering/v15_0_2_drive_countdown_fix.mjs index.html
          curl --fail --silent --show-error --location https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js -o three.min.js
          grep -q "Polygon Rush v15.0.2" index.html
          grep -q "car.pos.y+.90" index.html
          grep -q "ais.length!==4" index.html
          grep -q "function shapeDriveControls" index.html
          grep -q "bodyOwners:new Map()" index.html
          grep -q "const TRACK_CELL=24" index.html
          grep -q "gridIdx=\[2,258,4,256\]" index.html
          grep -q "countdown=3.15" index.html
          grep -q "function forceArcadeFallback" index.html
          grep -q "three.min.js" index.html
          test -s three.min.js
          test "$(wc -c < index.html)" -gt 50000

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69
          actions-cache-folder: emsdk-cache

      - name: Checkout Box3D v0.1.0
        run: git clone --depth 1 --branch v0.1.0 https://github.com/erincatto/box3d.git .box3d-src

      - name: Build Box3D library
        run: |
          emcmake cmake -S .box3d-src -B .box3d-src/build-web -DBOX3D_SAMPLES=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build .box3d-src/build-web --target box3d -j2
          test -s .box3d-src/build-web/src/libbox3d.a

      - name: Build Polygon Rush Box3D runtime
        run: |
          grep -q "static float g_state_buf\[7\]" polygon-rush/box3d/box3d_bridge.c
          grep -q "static float g_contact_buf" polygon-rush/box3d/box3d_bridge.c
          emcc polygon-rush/box3d/box3d_bridge.c \
            -I"$GITHUB_WORKSPACE/.box3d-src/include" \
            "$GITHUB_WORKSPACE/.box3d-src/build-web/src/libbox3d.a" \
            -O3 -msimd128 -msse2 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=createBox3DModule \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s ASSERTIONS=1 \
            -s EXPORTED_FUNCTIONS='["_pr_b3_create_world","_pr_b3_create_vehicle","_pr_b3_create_static_box","_pr_b3_destroy_body","_pr_b3_step","_pr_b3_apply_vehicle_control","_pr_b3_get_body_state","_pr_b3_get_contacts","_pr_b3_free_state","_pr_b3_free_contacts","_malloc","_free"]' \
            -s EXPORTED_RUNTIME_METHODS='["HEAP32","HEAPF32"]' \
            -o box3d_bridge.js
          test -s box3d_bridge.js
          test -s box3d_bridge.wasm

      - name: Verify Box3D vehicle actually moves
        run: |
          node <<'JS'
          const path=require('path');
          const createBox3DModule=require('./box3d_bridge.js');
          (async()=>{
            const m=await createBox3DModule({locateFile:p=>path.join(process.cwd(),p)});
            const world=m._pr_b3_create_world();
            if(!world) throw new Error('Box3D movement gate: world creation failed');
            const car=m._pr_b3_create_vehicle(world,0,2,0,0);
            if(!car) throw new Error('Box3D movement gate: vehicle creation failed');
            for(let i=0;i<120;i++){
              m._pr_b3_apply_vehicle_control(world,car,1,0,0,0,0,1,0);
              m._pr_b3_step(world,1/60,4);
            }
            const p=m._pr_b3_get_body_state(world,car);
            if(!p) throw new Error('Box3D movement gate: no body state');
            const b=p>>2,f=m.HEAPF32,x=f[b],z=f[b+2],vx=f[b+3],vz=f[b+5];
            const dist=Math.hypot(x,z),speed=Math.hypot(vx,vz);
            console.log('Box3D throttle movement:',{x,z,vx,vz,dist,speed});
            if(!(dist>0.5||speed>0.5)) throw new Error('Box3D movement gate: throttle produced no movement');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Validate generated game
        run: |
          node --check box3d_bridge.js
          node --check three.min.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/polygon-rush-inline.js').write_text(js)
          required=[
            "ais.length!==4","BOX3D.bodies.size!==5","car.pos.y+.90","f[base+1]-.90",
            "function shapeDriveControls","box3dApplyControl(car,shaped)","applyArcadeMovement(car,shaped,dt)",
            "bodyOwners:new Map()","const TRACK_CELL=24","function rebuildTrackSpatial","trackLookupStats.fallbacks++",
            "gridIdx=[2,258,4,256]","countdown=3.15","function forceArcadeFallback",
            "if(raceStarted&&!finished)updateAI(dt)","Box3D accepted throttle but produced no forward speed",
            "three.min.js","Polygon Rush v15.0.2 Drive + Countdown Fix"
          ]
          for r in required: assert r in s, r
          assert 'const FX={dustPool:[]' not in s
          assert 'new THREE.InstancedMesh' not in s
          assert 'function updateQuality()' not in s
          PY
          node --check /tmp/polygon-rush-inline.js
          python3 - <<'PY'
          from pathlib import Path
          b=Path('box3d_bridge.wasm').read_bytes()
          assert b[:8] == b'\x00asm\x01\x00\x00\x00'
          print('Box3D WASM bytes:',len(b))
          PY

      - name: Remove build-only source
        run: rm -rf .box3d-src

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
