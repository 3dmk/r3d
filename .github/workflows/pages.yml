name: Deploy Polygon Rush Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Polygon Rush v15.2 Clean Arcade Runtime
        run: |
          cat polygon-rush/v14.6/source/part*.txt > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(',1)}\n }\n}\n\nconst renderer','const renderer',1)
          p.write_text(s)
          PY
          node polygon-rush/engineering/v15_2_single_runtime_rebuild.mjs index.html
          curl --fail --silent --show-error --location https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js -o three.min.js
          test -s three.min.js
          test "$(wc -c < index.html)" -gt 50000

      - name: Validate clean generated game
        run: |
          node --check three.min.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/polygon-rush-inline.js').write_text(js)
          required=[
            'Polygon Rush v15.2 Clean Arcade Runtime',
            'playerIdx=248',
            'gridIdx=[250,252,254,256]',
            'countdown=3.2',
            'return applyArcadeMovement(car,controls,dt);',
            'if(raceStarted&&!finished)updateAI(dt)',
            'Physics backend: ARCADE',
            'three.min.js'
          ]
          for r in required: assert r in s, r
          forbidden=[
            '<script src="box3d_bridge.js"></script>',
            'if(BOX3D.active){box3dStep(dt);box3dSyncAllCars()}',
            'box3dApplyControl(car,controls);',
            'initBox3D();requestAnimationFrame(loop);'
          ]
          for r in forbidden: assert r not in s, r
          assert s.count('function hybridMove(car,controls,dt){')==1
          assert s.count('function start(){')==1
          assert s.count("if(e.code==='KeyR')recover();")==1
          PY
          node --check /tmp/polygon-rush-inline.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
