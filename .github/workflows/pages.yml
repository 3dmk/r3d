name: Promote Polygon Rush v15.5.30
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: polygon-rush-production
  cancel-in-progress: true
jobs:
  promote:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v15.5.30 modes migration
        run: node polygon-rush/engineering/v15_5_30_production_modes.mjs polygon-rush/production/index.html
      - name: Fix mode start ordering
        run: node polygon-rush/engineering/v15_5_30_mode_start_order_fix.mjs polygon-rush/production/index.html
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('polygon-rush/production/index.html').read_text()
          Path('/tmp/polygon-rush-inline.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/polygon-rush-inline.js
      - name: Install browser gate runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Run v15.5.30 browser release gate
        run: |
          python3 -m http.server 4173 --directory polygon-rush/production >/tmp/polygon-rush-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node polygon-rush/engineering/v15_5_30_browser_gate.cjs
      - name: Update manifest and commit production snapshot
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=pathlib.Path('polygon-rush/production')
          m=json.loads((r/'BUILD.json').read_text())
          m['productionVersion']='15.5.30'
          m['parentProductionVersion']='15.5.29'
          m['releaseGate']='browser-gated-success'
          m['deploymentModel']='committed-static-production'
          m['features']=['steer-under-power','test-track','free-roam','course-menu-self-heal']
          m['indexSha256']=hashlib.sha256((r/'index.html').read_bytes()).hexdigest()
          m['threeSha256']=hashlib.sha256((r/'three.min.js').read_bytes()).hexdigest()
          (r/'BUILD.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polygon-rush/production/index.html polygon-rush/production/VERSION.txt polygon-rush/production/BUILD.json
          git commit -m "Promote Polygon Rush v15.5.30 Test Track and Free Roam [skip ci]"
          git push origin HEAD:main
      - name: Validate committed production snapshot
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=pathlib.Path('polygon-rush/production');m=json.loads((r/'BUILD.json').read_text())
          assert m['productionVersion']=='15.5.30'
          assert 'test-track' in m['features'] and 'free-roam' in m['features']
          assert hashlib.sha256((r/'index.html').read_bytes()).hexdigest()==m['indexSha256']
          assert hashlib.sha256((r/'three.min.js').read_bytes()).hexdigest()==m['threeSha256']
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: polygon-rush/production
      - name: Deploy v15.5.30 to root site
        id: deployment
        uses: actions/deploy-pages@v4
