name: Deploy Polygon Rush Production
on:
  push:
    branches: [main]
    paths:
      - 'polygon-rush/production/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: polygon-rush-production
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed production snapshot
        run: |
          set -euo pipefail
          test -f polygon-rush/production/index.html
          test -f polygon-rush/production/three.min.js
          test -f polygon-rush/production/VERSION.txt
          test -f polygon-rush/production/BUILD.json
          test -f polygon-rush/production/_headers
          test -f polygon-rush/production/assets/models/player_body.glb
          test -f polygon-rush/production/assets/models/player_wheel.glb
          test -f polygon-rush/production/assets/models/city_building_a.glb
          test -f polygon-rush/production/assets/models/Textures/colormap.png
          test -f polygon-rush/production/vendor/GLTFLoader.js
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path('polygon-rush/production')
          meta=json.loads((root/'BUILD.json').read_text())
          assert meta['deploymentModel']=='committed-static-production'
          assert meta['releaseGate']=='browser-gated-success'
          assert meta['developmentScope']=='free-roam-only'
          assert meta['productionVersion']=='15.5.36'
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()==meta['indexSha256']
          assert hashlib.sha256((root/'three.min.js').read_bytes()).hexdigest()==meta['threeSha256']
          assert (root/'index.html').stat().st_size > 50000
          assert (root/'three.min.js').stat().st_size > 500000
          print('Polygon Rush static production validation PASS', meta['productionVersion'])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: polygon-rush/production
      - name: Deploy committed production to GitHub Pages root
        id: deployment
        uses: actions/deploy-pages@v4
