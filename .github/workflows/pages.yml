name: Deploy Polygon Rush Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Polygon Rush v15.5.11 Slip Traction + Brake Physics
        run: |
          cat polygon-rush/v14.6/source/part*.txt > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(',1)}\n }\n}\n\nconst renderer','const renderer',1)
          p.write_text(s)
          PY
          node polygon-rush/engineering/v15_4_core_drive_rebuild.mjs index.html
          node polygon-rush/engineering/v15_5_wheel_physics_rebuild.mjs index.html
          node polygon-rush/engineering/v15_5_1_wheel_axis_fix.mjs index.html
          node polygon-rush/engineering/v15_5_2_grip_collision_fix.mjs index.html
          node polygon-rush/engineering/v15_5_3_direction_stability_fix.mjs index.html
          node polygon-rush/engineering/v15_5_4_car_steering_fix.mjs index.html
          node polygon-rush/engineering/v15_5_5_drive_friction_fix.mjs index.html
          node polygon-rush/engineering/v15_5_6_weighted_drive_steering_fix.mjs index.html
          node polygon-rush/engineering/v15_5_7_corner_inertia_alignment_fix.mjs index.html
          node polygon-rush/engineering/v15_5_8_natural_mass_dynamics_fix.mjs index.html
          node polygon-rush/engineering/v15_5_9_force_wheel_contact_fix.mjs index.html
          node polygon-rush/engineering/v15_5_9_grid_contact_fix.mjs index.html
          node polygon-rush/engineering/v15_5_10_wheel_steering_cg_fix.mjs index.html
          node polygon-rush/engineering/v15_5_11_slip_traction_brake_fix.mjs index.html
          curl --fail --silent --show-error --location https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js -o three.min.js
          test -s three.min.js
          test "$(wc -c < index.html)" -gt 50000
          mkdir -p play/v15.5.11
          cp index.html play/v15.5.11/index.html
          cp three.min.js play/v15.5.11/three.min.js
          printf 'Polygon Rush v15.5.11 Slip Traction + Brake Physics\n' > play/v15.5.11/VERSION.txt

      - name: Validate generated game structure
        run: |
          node --check three.min.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/polygon-rush-inline.js').write_text(js)
          required=[
            'Polygon Rush v15.5.11 Slip Traction + Brake Physics','playerIdx=248','gridIdx=[252,254,256,258]','countdown=3.2',
            'testWheelForces:()=>','testPlayerDrive:()=>','testWheelSteeringTorque:()=>','testMassPhysics:()=>','testTractionBrakeSteer:()=>','testCollision:()=>','testAI:',
            'wheelInertia:6.5','driveWheelTorque:2350','brakeWheelTorque:2600','longSlipStiffness:6.0','absSlip:.12','tcSlip:.24',
            'slipRatio','driveTorque','brakeTorque','normalForce:normal','gripLimit:maxForce',
            'tireGeo.rotateZ(Math.PI/2)','rimGeo.rotateZ(Math.PI/2)',
            'w.userData.tire.rotation.set(w.userData.spin,0,0)','w.userData.rim.rotation.set(w.userData.spin,0,0)',
            'Physics backend: WHEEL PHYSICS','wheelPhysics:true','state:()=>','forceGo:()=>','three.min.js'
          ]
          for r in required: assert r in s, r
          forbidden=['<script src="box3d_bridge.js"></script>',"solver:'arcade'",'w.userData.tire.rotation.y=w.userData.spin','w.userData.rim.rotation.y=w.userData.spin','targetYaw']
          for r in forbidden: assert r not in s, r
          assert s.count('function applyArcadeMovement(car,controls,dt){')==1
          assert s.count('function resolveCarCollision(a,b){')==1
          assert s.count('function physicsPlayer(dt){')==1
          assert pathlib.Path('play/v15.5.11/VERSION.txt').read_text().strip()=='Polygon Rush v15.5.11 Slip Traction + Brake Physics'
          PY
          node --check /tmp/polygon-rush-inline.js

      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run traction brake steering gameplay release gate
        run: |
          python3 -m http.server 4173 >/tmp/polygon-rush-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > polygon-rush-browser-test.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:4173/play/v15.5.11/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__polygonRush?.boot===true,null,{timeout:15000});
            const boot=await page.evaluate(()=>window.__polygonRush);
            if(boot.version!=='15.5.11'||boot.solver!=='wheel-physics'||boot.wheelPhysics!==true)throw new Error('Wrong build: '+JSON.stringify(boot));
            await page.click('#start');
            await page.waitForFunction(()=>window.__polygonRush?.startOk===true&&typeof window.__polygonRush?.testTractionBrakeSteer==='function',null,{timeout:5000});
            const start=await page.evaluate(()=>window.__polygonRush.state());
            if(!start.hasPlayer||start.aiCount!==4||start.wheels!==4)throw new Error('Vehicle invariant failed: '+JSON.stringify(start));
            const t=await page.evaluate(()=>window.__polygonRush.testTractionBrakeSteer());
            if(!(t.accelSpeed>8&&t.maxDriveSlip>0.01&&t.maxDriveSlip<0.45&&t.steerAngle>0.09&&t.steerHeading>0.02&&t.brakeEnd<t.brakeStart*0.90&&t.brakeEnd>5&&t.brakeHeading>0.01&&t.maxBrakeLock<0.22&&t.brakeBodySlip<0.45&&t.frontLat>500))throw new Error('Traction/brake/steer gate failed: '+JSON.stringify(t));
            const steer=await page.evaluate(()=>window.__polygonRush.testWheelSteeringTorque());
            if(!(steer.turnYaw>steer.straightYaw+.005&&steer.torque>300&&steer.frontLat>700&&steer.headingChange>.02&&steer.inertia>1000))throw new Error('Wheel steering regression: '+JSON.stringify(steer));
            const mass=await page.evaluate(()=>window.__polygonRush.testMassPhysics());
            if(!(mass.lightSpeed>mass.heavySpeed*1.08&&mass.heavyInertia>mass.lightInertia*1.5))throw new Error('Mass regression: '+JSON.stringify(mass));
            const collision=await page.evaluate(()=>window.__polygonRush.testCollision());
            if(!(collision.after>2.9&&collision.relativeNormal>=-0.05))throw new Error('Collision regression: '+JSON.stringify(collision));
            const playerDrive=await page.evaluate(()=>window.__polygonRush.testPlayerDrive());
            if(!(playerDrive.distance>2.5&&playerDrive.speed>3.5&&playerDrive.force>700&&playerDrive.slip<0.36))throw new Error('Player drive regression: '+JSON.stringify(playerDrive));
            await page.evaluate(()=>window.__polygonRush.forceGo());
            const aiDistances=await page.evaluate(()=>window.__polygonRush.testAI(180));
            if(!aiDistances.every(d=>d>0.5))throw new Error('AI movement failed: '+JSON.stringify(aiDistances));
            if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
            console.log('V15.5.11 RELEASE GATE PASS',JSON.stringify({t,steer,mass,collision,playerDrive,aiDistances}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node polygon-rush-browser-test.cjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
