name: Deploy Polygon Rush Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Polygon Rush v15.5.6 Weighted Drive + Steering Fix
        run: |
          cat polygon-rush/v14.6/source/part*.txt > index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(',1)}\n }\n}\n\nconst renderer','const renderer',1)
          p.write_text(s)
          PY
          node polygon-rush/engineering/v15_4_core_drive_rebuild.mjs index.html
          node polygon-rush/engineering/v15_5_wheel_physics_rebuild.mjs index.html
          node polygon-rush/engineering/v15_5_1_wheel_axis_fix.mjs index.html
          node polygon-rush/engineering/v15_5_2_grip_collision_fix.mjs index.html
          node polygon-rush/engineering/v15_5_3_direction_stability_fix.mjs index.html
          node polygon-rush/engineering/v15_5_4_car_steering_fix.mjs index.html
          node polygon-rush/engineering/v15_5_5_drive_friction_fix.mjs index.html
          node polygon-rush/engineering/v15_5_6_weighted_drive_steering_fix.mjs index.html
          curl --fail --silent --show-error --location https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js -o three.min.js
          test -s three.min.js
          test "$(wc -c < index.html)" -gt 50000
          mkdir -p play/v15.5.6
          cp index.html play/v15.5.6/index.html
          cp three.min.js play/v15.5.6/three.min.js
          printf 'Polygon Rush v15.5.6 Weighted Drive + Steering Fix\n' > play/v15.5.6/VERSION.txt

      - name: Validate generated game structure
        run: |
          node --check three.min.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          js='\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/polygon-rush-inline.js').write_text(js)
          required=[
            'Polygon Rush v15.5.6 Weighted Drive + Steering Fix',
            'playerIdx=248','gridIdx=[250,251,253,254]','countdown=3.2',
            'testCarSteering:()=>','testStraightHold:()=>','testDriveFriction:()=>',
            'testWeightedDrive:()=>','testSteerCurve:()=>',
            'throttleRise:3.4','throttleFall:5.8','accelWeight:.58','steerCurve:1.72','steerCenter:5.4',
            'tireGeo.rotateZ(Math.PI/2)','rimGeo.rotateZ(Math.PI/2)',
            'w.userData.tire.rotation.set(w.userData.spin,0,0)',
            'w.userData.rim.rotation.set(w.userData.spin,0,0)',
            'Physics backend: WHEEL PHYSICS','wheelPhysics:true','state:()=>','testAI:','wheelEuler:','forceGo:()=>','three.min.js'
          ]
          for r in required: assert r in s, r
          forbidden=['<script src="box3d_bridge.js"></script>',"solver:'arcade'",'w.userData.tire.rotation.y=w.userData.spin','w.userData.rim.rotation.y=w.userData.spin']
          for r in forbidden: assert r not in s, r
          assert s.count('function applyArcadeMovement(car,controls,dt){')==1
          assert s.count('function resolveCarCollision(a,b){')==1
          assert s.count('function physicsPlayer(dt){')==1
          v=pathlib.Path('play/v15.5.6/index.html').read_text()
          assert 'Polygon Rush v15.5.6 Weighted Drive + Steering Fix' in v
          assert pathlib.Path('play/v15.5.6/VERSION.txt').read_text().strip()=='Polygon Rush v15.5.6 Weighted Drive + Steering Fix'
          PY
          node --check /tmp/polygon-rush-inline.js

      - name: Install browser test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run weighted drive steering gameplay release gate
        run: |
          python3 -m http.server 4173 >/tmp/polygon-rush-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > polygon-rush-browser-test.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:4173/play/v15.5.6/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__polygonRush?.boot===true,null,{timeout:15000});
            const boot=await page.evaluate(()=>window.__polygonRush);
            if(boot.version!=='15.5.6'||boot.solver!=='wheel-physics'||boot.wheelPhysics!==true)throw new Error('Wrong build: '+JSON.stringify(boot));
            await page.click('#start');
            await page.waitForFunction(()=>window.__polygonRush?.startOk===true&&typeof window.__polygonRush?.testWeightedDrive==='function'&&typeof window.__polygonRush?.testSteerCurve==='function',null,{timeout:5000});
            const start=await page.evaluate(()=>({diag:window.__polygonRush,state:window.__polygonRush.state()}));
            if(!start.state.hasPlayer||start.state.aiCount!==4||start.diag.racers!==5||start.state.wheels!==4)throw new Error('Five-car/four-wheel invariant failed: '+JSON.stringify(start));

            const weight=await page.evaluate(()=>window.__polygonRush.testWeightedDrive());
            if(!(weight.s6>0&&weight.s31>weight.s6*2&&weight.s91>weight.s31*1.5&&weight.throttle>.9&&weight.accel>0))throw new Error('Weighted acceleration failed: '+JSON.stringify(weight));
            const steer=await page.evaluate(()=>window.__polygonRush.testSteerCurve());
            if(!(steer.full>steer.small*2.1&&steer.fullAngle>steer.smallAngle*2.1&&steer.small>0.005))throw new Error('Nonlinear steering curve failed: '+JSON.stringify(steer));
            const drive=await page.evaluate(()=>window.__polygonRush.testDriveFriction());
            if(!(drive.driven>7&&drive.coastEnd<drive.coastStart-1&&drive.brakeEnd<9))throw new Error('Drive/friction regression: '+JSON.stringify(drive));
            const car=await page.evaluate(()=>window.__polygonRush.testCarSteering());
            if(!(car.headingChange>0.15&&car.distance>15&&car.slip<0.08&&car.align<0.08))throw new Error('Car steering regression: '+JSON.stringify(car));
            const collision=await page.evaluate(()=>window.__polygonRush.testCollision());
            if(!(collision.after>2.9&&collision.relativeNormal>=-0.05))throw new Error('Collision regression: '+JSON.stringify(collision));

            await page.evaluate(()=>window.__polygonRush.forceGo());
            const aiDistances=await page.evaluate(()=>window.__polygonRush.testAI(180));
            if(!aiDistances.every(d=>d>0.5))throw new Error('All AI must move: '+JSON.stringify(aiDistances));
            if(errors.length)throw new Error('Runtime errors: '+errors.join(' | '));
            console.log('V15.5.6 RELEASE GATE PASS',JSON.stringify({weight,steer,drive,car,collision,aiDistances}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node polygon-rush-browser-test.cjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
