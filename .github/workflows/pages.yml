name: Promote Polygon Rush v15.5.32
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: polygon-rush-production
  cancel-in-progress: true
jobs:
  promote:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply real surface collisions
        run: node polygon-rush/engineering/v15_5_32_real_surface_collisions.mjs polygon-rush/production/index.html
      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser release gate
        run: |
          python3 -m http.server 4173 --directory polygon-rush/production >/tmp/pr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node polygon-rush/engineering/v15_5_32_browser_gate.cjs
      - name: Finalize production metadata
        run: node polygon-rush/engineering/v15_5_32_finalize.mjs
      - name: Commit certified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polygon-rush/production/index.html polygon-rush/production/VERSION.txt polygon-rush/production/BUILD.json
          git commit -m "Promote Polygon Rush v15.5.32 real surface collisions [skip ci]"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: polygon-rush/production
      - name: Deploy v15.5.32 to root site
        id: deployment
        uses: actions/deploy-pages@v4
