name: Apply Polygon Rush v16.0.4 Reference Vehicle Dynamics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply_v16_0_4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v16.0.4
        run: node polygon-rush/engineering/v16_0_4_reference_vehicle_dynamics.mjs polygon-rush/production/index.html
      - name: Validate runtime
        run: |
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('polygon-rush/production/index.html').read_text()
          m=re.search(r'<script type="module">([\s\S]*?)</script>',s)
          assert m
          pathlib.Path('/tmp/pr164.mjs').write_text(m.group(1))
          PY
          node --check /tmp/pr164.mjs
          grep -q "VERSION='16.0.4'" polygon-rush/production/index.html
          grep -q 'function ackermannAngle' polygon-rush/production/index.html
          grep -q 'combinedGrip:true' polygon-rush/production/index.html
      - name: Update metadata
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=pathlib.Path('polygon-rush/production'); p=r/'BUILD.json'; d=json.loads(p.read_text())
          d['productionVersion']='16.0.4';d['parentProductionVersion']='16.0.3';d['handlingFix']='reference-vehicle-dynamics'
          d['features']=list(dict.fromkeys(d.get('features',[])+['ackermann-steering','per-wheel-tire-forces','combined-grip-friction-circle','tire-force-relaxation','surface-tangent-tire-forces']))
          d['indexSha256']=hashlib.sha256((r/'index.html').read_bytes()).hexdigest();d['threeSha256']=hashlib.sha256((r/'three.min.js').read_bytes()).hexdigest();p.write_text(json.dumps(d,indent=2)+'\n');(r/'VERSION.txt').write_text('16.0.4\n')
          PY
      - name: Commit production
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add polygon-rush/production/index.html polygon-rush/production/BUILD.json polygon-rush/production/VERSION.txt
          git commit -m 'Promote Polygon Rush v16.0.4 reference vehicle dynamics'
          git push
