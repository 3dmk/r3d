name: Apply Polygon Rush v16.0.3 Working Vehicle Restore
on:
  push:
    branches: [main]
    paths:
      - 'polygon-rush/engineering/v16_0_3_restore_working_vehicle.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v16.0.3
        run: node polygon-rush/engineering/v16_0_3_restore_working_vehicle.mjs polygon-rush/production/index.html
      - name: Validate runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('polygon-rush/production/index.html').read_text()
          for x in ["VERSION='16.0.3'","mass:1180","springK:30000","engineForce:9200","physicsWheelRadius:.39","workingVehicleTuneRestored:true"]:
              assert x in s, x
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          inline='\n'.join(x for x in blocks if x.strip())
          pathlib.Path('/tmp/pr.mjs').write_text(inline)
          PY
          node --check /tmp/pr.mjs
      - name: Update metadata
        run: |
          printf '%s\n' 'Polygon Rush v16.0.3 Working Vehicle Restore' > polygon-rush/production/VERSION.txt
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path('polygon-rush/production')
          p=root/'BUILD.json';m=json.loads(p.read_text())
          m['productionVersion']='16.0.3';m['parentProductionVersion']='16.0.2'
          m['releaseGate']='clean-core-static-validated'
          m['regressionRepair']='restore-v16.0.1-working-vehicle-tune'
          m['indexSha256']=hashlib.sha256((root/'index.html').read_bytes()).hexdigest()
          m['threeSha256']=hashlib.sha256((root/'three.min.js').read_bytes()).hexdigest()
          fs=set(m.get('features',[]));fs.update(['working-vehicle-tune-restored','larger-visual-wheels-only','physics-wheel-radius-restored'])
          m['features']=sorted(fs);p.write_text(json.dumps(m,indent=2)+'\n')
          PY
      - name: Commit production
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add polygon-rush/production/index.html polygon-rush/production/VERSION.txt polygon-rush/production/BUILD.json
          git commit -m 'Promote Polygon Rush v16.0.3 working vehicle restore' || exit 0
          git push
